pull_request_rules:
  - name: 🚀 Auto-merge PRs with Approved Reviews & Security Compliance
    conditions:
      - "#files > 0"
      - "status-success=ci/circleci: build"
      - "approved-reviews-by>=1"
    actions:
      merge:
        method: squash

  - name: 🛑 Block PRs Containing Suspicious Transaction Updates
    conditions:
      - "title~=.*(Transaction|BTC|Crypto).*"
      - "files~=.*(transaction_data|mempool).*"
      - "label!=verified"
    actions:
      comment:
        message: "🚨 This PR contains sensitive transaction data and requires manual review!"
      request_reviews:
        users:
          - security-team
      assign:
        users:
          - fraud-detection-bot

  - name: ⚡ Auto-approve & Merge Security Updates
    conditions:
      - "title~=^(Security|Bugfix):"
      - "author=dependabot[bot]"
    actions:
      review:
        type: APPROVE
      merge:
        method: rebase

  - name: 🔍 AI-Powered Fraud Detection on Transaction Files
    conditions:
      - "files~=.*(mempool|transactions).*"
    actions:
      run:
        name: "AI Fraud Detection Scan"
        command: |
          python scripts/fraud_detection.py --scan transactions/
      comment:
        message: "🤖 AI risk analysis in progress... Results will be posted shortly!"

  - name: 🔔 Send Discord & Telegram Alerts for High-Risk Transactions
    conditions:
      - "label=high-risk-transaction"
    actions:
      discord:
        webhook_url: "${{ secrets.DISCORD_WEBHOOK }}"
        message: "🚨 **High-Risk Transaction Alert!** A suspicious Bitcoin transaction was detected in PR: ${{ pull_request.html_url }}"
      telegram:
        bot_token: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
        chat_id: "${{ secrets.TELEGRAM_CHAT_ID }}"
        message: "⚠️ High-risk transaction detected! Please review: ${{ pull_request.html_url }}"

  - name: 📝 Log Flagged Transactions to Database
    conditions:
      - "label=high-risk-transaction"
    actions:
      run:
        name: "Store in Security DB"
        command: |
          python scripts/store_to_db.py --tx-id="${{ pull_request.number }}"

  - name: 🛠️ Schedule Fraud Risk Model Optimization
    conditions:
      - "merged"
    actions:
      run:
        name: "Optimize AI Risk Model"
        command: |
          python scripts/ai_model_tuning.py